<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Từ Vựng - Phong cách Duolingo</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', 'Segoe UI', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #3c3c3c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* TYPOGRAPHY */
        h1 {
            color: #58cc02;
            font-size: 38px;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 0 2px 0 #46a302;
        }

        p {
            color: #777;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        /* DUOLINGO BUTTON STYLES */
        .btn-duo {
            background-color: #58cc02;
            color: white;
            border: none;
            border-bottom: 5px solid #46a302;
            padding: 14px 28px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            transition: all 0.1s ease;
            outline: none;
            display: inline-block;
            margin: 5px;
        }

        .btn-duo:hover {
            filter: brightness(1.05);
        }

        .btn-duo:active {
            transform: translateY(4px);
            border-bottom-width: 1px;
            margin-bottom: 4px;
        }

        .btn-secondary {
            background-color: #ffffff;
            color: #afafaf;
            border: 2px solid #e5e5e5;
            border-bottom: 4px solid #e5e5e5;
            padding: 10px 20px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.1s ease;
        }

        .btn-secondary:hover {
            background-color: #f7f7f7;
            color: #4b4b4b;
        }

        .btn-secondary:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        /* HOME PAGE STYLES */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 18px;
            margin-bottom: 35px;
        }

        .btn-category {
            background: #ffffff;
            border: 2px solid #e5e5e5;
            border-bottom: 5px solid #e5e5e5;
            padding: 25px 15px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: 800;
            color: #4b4b4b;
            cursor: pointer;
            transition: all 0.1s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .btn-category span.icon {
            font-size: 40px;
        }

        .btn-category:hover {
            background-color: #ddf4ff;
            border-color: #84d8ff;
            border-bottom-color: #1cb0f6;
            color: #1cb0f6;
            transform: translateY(-2px);
        }

        .btn-category.wrong-words {
            border-color: #ffcdd2;
            border-bottom-color: #ff4b4b;
            background: #fff5f5;
            color: #ea2b2b;
        }

        .btn-category.wrong-words:hover {
            background-color: #ffebee;
            border-color: #ff4b4b;
            color: #d32f2f;
        }

        /* WRONG WORDS LIST SECTION */
        .wrong-words-section {
            background: #ffffff;
            border: 2px solid #ffcdd2;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: left;
        }

        .wrong-words-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .wrong-words-header h3 {
            font-size: 18px;
            font-weight: 800;
            color: #ea2b2b;
            text-transform: uppercase;
        }

        .wrong-words-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            max-height: 250px;
            overflow-y: auto;
        }

        .wrong-word-card {
            background: #fff5f5;
            border: 2px solid #ffcdd2;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .wrong-word-en {
            font-size: 16px;
            font-weight: 900;
            color: #3c3c3c;
        }

        .wrong-word-phonetic {
            font-size: 13px;
            font-weight: 700;
            color: #1cb0f6;
        }

        .wrong-word-vi {
            font-size: 14px;
            font-weight: 800;
            color: #ea2b2b;
        }

        /* HISTORY SECTION */
        .history-section {
            background: #ffffff;
            border: 2px solid #e5e5e5;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: left;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .history-header h3 {
            font-size: 18px;
            font-weight: 800;
            color: #4b4b4b;
            text-transform: uppercase;
        }

        .btn-clear-history {
            background: none;
            border: none;
            color: #ff4b4b;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-clear-history:hover {
            text-decoration: underline;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 350px;
            overflow-y: auto;
        }

        .history-item {
            background: #f7f7f7;
            border: 2px solid #e5e5e5;
            border-radius: 14px;
            padding: 12px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .history-info-cat {
            font-size: 16px;
            font-weight: 800;
            color: #3c3c3c;
        }

        .history-info-date {
            font-size: 13px;
            font-weight: 700;
            color: #afafaf;
        }

        .history-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .history-score-badge {
            font-size: 15px;
            font-weight: 900;
            color: #58cc02;
            background: #e8fccf;
            padding: 6px 12px;
            border-radius: 10px;
        }

        .history-score-badge.bad {
            color: #ea2b2b;
            background: #ffdadc;
        }

        .btn-view-details {
            background: #1cb0f6;
            color: white;
            border: none;
            border-bottom: 3px solid #1899d6;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-view-details:active {
            transform: translateY(2px);
            border-bottom-width: 1px;
        }

        .history-details-box {
            display: none;
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 12px;
            margin-top: 5px;
            flex-direction: column;
            gap: 8px;
        }

        .load-file-box {
            background: #f7f7f7;
            border: 2px dashed #cecece;
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            gap: 15px;
            flex-wrap: wrap;
        }

        .form-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
            text-align: left;
        }

        .form-box {
            background: #ffffff;
            border: 2px solid #e5e5e5;
            border-radius: 18px;
            padding: 20px;
        }

        .form-box h3 {
            font-size: 16px;
            font-weight: 800;
            color: #777;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }

        .input-group input, .input-group select {
            padding: 14px;
            border: 2px solid #e5e5e5;
            border-radius: 12px;
            outline: none;
            font-size: 16px;
            font-weight: 700;
            background: #f7f7f7;
            color: #4b4b4b;
            width: 100%;
        }

        .input-group input:focus, .input-group select:focus {
            background: #ffffff;
            border-color: #1cb0f6;
        }

        /* QUIZ PAGE & PROGRESS BAR */
        .quiz-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .progress-bar-container {
            flex: 1;
            height: 18px;
            background-color: #e5e5e5;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: #58cc02;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .quiz-layout {
            display: flex;
            gap: 30px;
            text-align: left;
        }

        .question-sidebar {
            width: 220px;
            min-width: 220px;
            background: #f7f7f7;
            border: 2px solid #e5e5e5;
            border-radius: 18px;
            padding: 15px;
        }

        .sidebar-title {
            font-size: 14px;
            font-weight: 800;
            color: #afafaf;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 12px;
        }

        .grid-questions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            max-height: 320px;
            overflow-y: auto;
        }

        .q-box {
            aspect-ratio: 1;
            background: #fff;
            border: 2px solid #e5e5e5;
            border-bottom: 3px solid #e5e5e5;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 15px;
            color: #afafaf;
            cursor: pointer;
            transition: 0.1s;
        }

        .q-box.active {
            border-color: #1cb0f6;
            border-bottom-color: #1899d6;
            color: #1cb0f6;
            background: #ddf4ff;
        }

        .q-box.correct {
            background: #58cc02 !important;
            border-color: #58cc02 !important;
            color: white !important;
        }

        .q-box.wrong {
            background: #ff4b4b !important;
            border-color: #ff4b4b !important;
            color: white !important;
        }

        .quiz-main {
            flex: 1;
            min-width: 0;
        }

        /* DUOLINGO CARD DISPLAY */
        .word-card {
            border: 2px solid #e5e5e5;
            border-bottom: 5px solid #e5e5e5;
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 25px;
            background: #ffffff;
        }

        .word-display {
            font-size: 40px;
            font-weight: 900;
            color: #3c3c3c;
            word-break: break-word;
        }

        .phonetic-display {
            font-size: 20px;
            font-weight: 700;
            color: #1cb0f6;
            margin-top: 6px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn-option {
            background: #ffffff;
            border: 2px solid #e5e5e5;
            border-bottom: 4px solid #e5e5e5;
            padding: 18px 15px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 800;
            color: #4b4b4b;
            cursor: pointer;
            transition: all 0.1s ease;
            text-align: center;
            word-break: break-word;
        }

        .btn-option:hover {
            background-color: #f7f7f7;
            border-color: #d0d0d0;
        }

        .btn-option.correct {
            background-color: #d7ffb8 !important;
            border-color: #58cc02 !important;
            border-bottom-color: #58cc02 !important;
            color: #58cc02 !important;
        }

        .btn-option.wrong {
            background-color: #ffdadc !important;
            border-color: #ff4b4b !important;
            border-bottom-color: #ff4b4b !important;
            color: #ea2b2b !important;
        }

        /* RESULT PAGE & REVIEW */
        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #ffc800;
            border-bottom: 6px solid #e5b200;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
            font-weight: 900;
            margin: 20px auto 30px auto;
            text-shadow: 0 2px 0 #d1a200;
        }

        .review-container {
            margin-top: 35px;
            text-align: left;
            border-top: 2px dashed #e5e5e5;
            padding-top: 25px;
        }

        .review-title {
            font-size: 20px;
            font-weight: 800;
            color: #3c3c3c;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .review-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .review-item {
            background: #ffffff;
            border: 2px solid #e5e5e5;
            border-bottom: 4px solid #e5e5e5;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .review-item.is-correct {
            border-color: #b7f397;
            background: #f7ffe6;
        }

        .review-item.is-wrong {
            border-color: #ffcdd2;
            background: #fff5f5;
        }

        .review-word-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .review-word-en {
            font-size: 18px;
            font-weight: 900;
            color: #3c3c3c;
        }

        .review-word-phonetic {
            font-size: 14px;
            font-weight: 700;
            color: #1cb0f6;
        }

        .review-answers {
            text-align: right;
            font-weight: 700;
            font-size: 15px;
        }

        .text-correct {
            color: #58cc02;
        }

        .text-wrong {
            color: #ea2b2b;
            text-decoration: line-through;
            margin-right: 8px;
        }

        /* RESPONSIVE MEDIA QUERIES CHO MỌI THIẾT BỊ */
        @media (max-width: 768px) {
            body {
                padding: 10px;
                align-items: flex-start;
            }

            h1 {
                font-size: 28px;
            }

            p {
                font-size: 16px;
                margin-bottom: 15px;
            }

            .form-section {
                grid-template-columns: 1fr;
            }

            .quiz-layout {
                flex-direction: column;
                gap: 20px;
            }

            .question-sidebar {
                width: 100%;
                min-width: 100%;
            }

            .grid-questions {
                grid-template-columns: repeat(6, 1fr);
                max-height: 140px;
            }

            .options-grid {
                grid-template-columns: 1fr;
            }

            .word-display {
                font-size: 30px;
            }

            .load-file-box {
                flex-direction: column;
                align-items: stretch;
            }

            .btn-duo {
                padding: 12px 20px;
                font-size: 16px;
                width: 100%;
                margin: 5px 0;
            }

            .review-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .review-answers {
                text-align: left;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. TRANG CHỦ -->
        <div id="home-page" class="page active">
            <h1>HỌC TỪ VỰNG</h1>
            <p>Chọn một chủ đề để bắt đầu luyện tập hôm nay!</p>

            <div class="load-file-box">
                <span>📂 Nạp file JSON bài học:</span>
                <input type="file" id="json-file-input" accept=".json" onchange="importJSONFile(event)">
            </div>

            <div class="category-grid" id="category-grid"></div>

            <div class="form-section">
                <div class="form-box">
                    <h3>📁 Tạo Chủ Đề Mới</h3>
                    <div class="input-group">
                        <input type="text" id="new-cat-icon" placeholder="Emoji (VD: 🚗, 🍔)">
                        <input type="text" id="new-cat-name" placeholder="Tên chủ đề...">
                    </div>
                    <button class="btn-duo" style="background: #1cb0f6; border-bottom-color: #1899d6; width: 100%;" onclick="createNewCategory()">Tạo & Lưu JSON</button>
                </div>

                <div class="form-box">
                    <h3>➕ Thêm Từ Mới</h3>
                    <div class="input-group">
                        <select id="select-category"></select>
                        <input type="text" id="new-en" placeholder="Từ Tiếng Anh (VD: Apple)">
                        <input type="text" id="new-phonetic" placeholder="Phiên âm IPA (VD: /ˈæp.əl/)">
                        <input type="text" id="new-vi" placeholder="Nghĩa Tiếng Việt (VD: Quả táo)">
                    </div>
                    <button class="btn-duo" style="width: 100%;" onclick="addNewWord()">Thêm & Cập Nhật</button>
                </div>
            </div>
            
            <!-- SỔ TỪ VỰNG LÀM SAI -->
            <div class="wrong-words-section" id="wrong-words-section">
                <div class="wrong-words-header">
                    <h3>⚠️ Sổ Từ VỰNG Làm Sai (<span id="wrong-count">0</span> từ)</h3>
                    <button class="btn-duo" style="background:#ff4b4b; border-bottom-color:#ea2b2b; padding:8px 16px; font-size:14px; width:auto;" onclick="startQuiz('wrong_words')">Ôn Tập Từ Sai Now</button>
                </div>
                <div class="wrong-words-list" id="wrong-words-list"></div>
            </div>

            <!-- KHU VỰC LỊCH SỬ BÀI LÀM -->
            <div class="history-section">
                <div class="history-header">
                    <h3>📊 Lịch Sử Bài Làm (Có xem lại chi tiết)</h3>
                    <button class="btn-clear-history" onclick="clearHistory()">Xóa lịch sử</button>
                </div>
                <div class="history-list" id="history-list"></div>
            </div>
        </div>

        <!-- 2. TRANG KIỂM TRA -->
        <div id="quiz-page" class="page">
            <div class="quiz-header">
                <button class="btn-secondary" onclick="showPage('home-page')">✕</button>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progress-bar"></div>
                </div>
            </div>
            
            <div class="quiz-layout">
                <div class="question-sidebar">
                    <div class="sidebar-title">CÁC CÂU HỎI</div>
                    <div class="grid-questions" id="grid-questions"></div>
                </div>

                <div class="quiz-main">
                    <div class="word-card">
                        <div class="word-display" id="word-display">Apple</div>
                        <div class="phonetic-display" id="phonetic-display">/ˈæp.əl/</div>
                    </div>

                    <div class="options-grid" id="options-container"></div>

                    <div style="display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;">
                        <button class="btn-secondary" onclick="prevQuestion()">← Câu trước</button>
                        <button class="btn-secondary" onclick="nextQuestion()">Câu sau →</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. TRANG KẾT QUẢ PHIÊN LÀM BÀI VỪA XONG -->
        <div id="result-page" class="page">
            <h1>HOÀN THÀNH BÀI HỌC!</h1>
            <p>Bạn đã hoàn thành bài kiểm tra này</p>
            
            <div class="score-circle" id="final-score">0/0</div>
            
            <p id="feedback-text" style="color: #4b4b4b; font-size: 22px; font-weight: 800;"></p>
            
            <div style="margin-top: 25px; display: flex; flex-direction: column; gap: 10px; align-items: center;">
                <button class="btn-duo" onclick="startQuiz(currentCategory)" style="width: 100%; max-width: 300px;">Thử lại</button>
                <button class="btn-duo" style="background: #ff9600; border-bottom-color: #e58700; width: 100%; max-width: 300px;" onclick="toggleReviewSection()">👁️ Xem lại bài vừa làm</button>
                <button class="btn-duo" style="background: #1cb0f6; border-bottom-color: #1899d6; width: 100%; max-width: 300px;" onclick="showPage('home-page')">Trang Chủ</button>
            </div>

            <div class="review-container" id="review-section" style="display: none;">
                <div class="review-title">
                    <span>📝</span>
                    <span>CHI TIẾT BÀI LÀM:</span>
                </div>
                <div class="review-list" id="review-list"></div>
            </div>
        </div>
    </div>

    <script>
        const defaultCategories = [
            { id: 'fruits', name: 'Hoa Quả', icon: '🍎' },
            { id: 'objects', name: 'Đồ Vật', icon: '💻' },
            { id: 'animals', name: 'Động Vật', icon: '🐘' }
        ];

        const defaultVocabulary = {
            fruits: [
                { word: "Apple", phonetic: "/ˈæp.əl/", meaning: "Quả táo" },
                { word: "Banana", phonetic: "/bəˈnɑː.nə/", meaning: "Quả chuối" },
                { word: "Orange", phonetic: "/ˈɒr.ɪndʒ/", meaning: "Quả cam" },
                { word: "Mango", phonetic: "/ˈmæŋ.ɡəʊ/", meaning: "Quả xoài" }
            ],
            objects: [
                { word: "Computer", phonetic: "/kəmˈpjuː.tər/", meaning: "Máy tính" },
                { word: "Book", phonetic: "/bʊk/", meaning: "Quyển sách" },
                { word: "Chair", phonetic: "/tʃeər/", meaning: "Cái ghế" },
                { word: "Table", phonetic: "/ˈteɪ.bəl/", meaning: "Cái bàn" }
            ],
            animals: [
                { word: "Elephant", phonetic: "/ˈel.ɪ.fənt/", meaning: "Con voi" },
                { word: "Dog", phonetic: "/dɒɡ/", meaning: "Con chó" },
                { word: "Cat", phonetic: "/kæt/", meaning: "Con mèo" },
                { word: "Tiger", phonetic: "/ˈtaɪ.ɡər/", meaning: "Con hổ" }
            ]
        };

        let categories = JSON.parse(localStorage.getItem('vocab_categories')) || defaultCategories;
        let dbVocabulary = JSON.parse(localStorage.getItem('vocab_db')) || defaultVocabulary;
        let testHistory = JSON.parse(localStorage.getItem('vocab_history')) || [];
        let wrongWordsStore = JSON.parse(localStorage.getItem('vocab_wrong_words')) || [];

        let currentQuizData = [];
        let currentQuestion = 0;
        let score = 0;
        let currentCategory = 'all';

        renderCategoryGrid();
        renderCategoryDropdown();
        renderHistory();
        renderWrongWords();

        function saveToLocalStorage() {
            localStorage.setItem('vocab_categories', JSON.stringify(categories));
            localStorage.setItem('vocab_db', JSON.stringify(dbVocabulary));
            localStorage.setItem('vocab_wrong_words', JSON.stringify(wrongWordsStore));
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            if (pageId === 'home-page') {
                renderHistory();
                renderWrongWords();
                renderCategoryGrid();
            }
        }

        function renderCategoryGrid() {
            const grid = document.getElementById('category-grid');
            grid.innerHTML = '';

            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'btn-category';
                btn.innerHTML = `<span class="icon">${cat.icon}</span> <span>${cat.name}</span>`;
                btn.onclick = () => startQuiz(cat.id);
                grid.appendChild(btn);
            });

            const allBtn = document.createElement('button');
            allBtn.className = 'btn-category';
            allBtn.innerHTML = `<span class="icon">🎯</span> <span>Tất Cả Từ</span>`;
            allBtn.onclick = () => startQuiz('all');
            grid.appendChild(allBtn);

            if (wrongWordsStore.length > 0) {
                const wrongBtn = document.createElement('button');
                wrongBtn.className = 'btn-category wrong-words';
                wrongBtn.innerHTML = `<span class="icon">⚠️</span> <span>Ôn Từ Làm Sai (${wrongWordsStore.length})</span>`;
                wrongBtn.onclick = () => startQuiz('wrong_words');
                grid.appendChild(wrongBtn);
            }
        }

        function renderCategoryDropdown() {
            const select = document.getElementById('select-category');
            select.innerHTML = '';

            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.id;
                opt.textContent = `${cat.icon} ${cat.name}`;
                select.appendChild(opt);
            });
        }

        function renderWrongWords() {
            const wrongSection = document.getElementById('wrong-words-section');
            const wrongList = document.getElementById('wrong-words-list');
            const wrongCount = document.getElementById('wrong-count');

            wrongCount.textContent = wrongWordsStore.length;

            if (wrongWordsStore.length === 0) {
                wrongSection.style.display = 'none';
                return;
            }

            wrongSection.style.display = 'block';
            wrongList.innerHTML = '';

            wrongWordsStore.forEach(item => {
                const div = document.createElement('div');
                div.className = 'wrong-word-card';
                div.innerHTML = `
                    <div class="wrong-word-en">${item.word}</div>
                    ${item.phonetic ? `<div class="wrong-word-phonetic">${item.phonetic}</div>` : ''}
                    <div class="wrong-word-vi">➜ ${item.meaning}</div>
                `;
                wrongList.appendChild(div);
            });
        }

        function renderHistory() {
            const historyList = document.getElementById('history-list');
            if (!historyList) return;

            if (testHistory.length === 0) {
                historyList.innerHTML = '<p style="font-size: 15px; color: #afafaf; margin: 0; font-weight:700;">Chưa có lịch sử làm bài nào.</p>';
                return;
            }

            historyList.innerHTML = '';
            testHistory.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'history-item';

                const percent = Math.round((item.score / item.total) * 100);
                const isGood = percent >= 60;

                let detailsHTML = '';
                if (item.details && item.details.length > 0) {
                    detailsHTML = item.details.map((q, idx) => {
                        const isCorrect = q.userStatus === 'correct';
                        return `
                            <div class="review-item ${isCorrect ? 'is-correct' : 'is-wrong'}" style="padding:10px; margin-top:5px;">
                                <div class="review-word-info">
                                    <div class="review-word-en">Câu ${idx + 1}: ${q.word}</div>
                                    ${q.phonetic ? `<div class="review-word-phonetic">${q.phonetic}</div>` : ''}
                                </div>
                                <div class="review-answers">
                                    ${isCorrect ? `<span class="text-correct">✓ ${q.correct}</span>` : `<span class="text-wrong">${q.selectedAnswer || 'Bỏ dở'}</span><span class="text-correct">✓ ${q.correct}</span>`}
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    detailsHTML = '<p style="font-size:13px; color:#999;">Không có dữ liệu chi tiết cho bài học này.</p>';
                }

                div.innerHTML = `
                    <div class="history-item-top">
                        <div>
                            <div class="history-info-cat">${item.categoryName}</div>
                            <div class="history-info-date">${item.date}</div>
                        </div>
                        <div class="history-right">
                            <div class="history-score-badge ${isGood ? '' : 'bad'}">
                                ${item.score}/${item.total} (${percent}%)
                            </div>
                            <button class="btn-view-details" onclick="toggleHistoryDetails(${index})">👁️ Xem chi tiết</button>
                        </div>
                    </div>
                    <div class="history-details-box" id="history-detail-${index}">
                        ${detailsHTML}
                    </div>
                `;
                historyList.appendChild(div);
            });
        }

        function toggleHistoryDetails(index) {
            const detailBox = document.getElementById(`history-detail-${index}`);
            if (detailBox.style.display === 'flex') {
                detailBox.style.display = 'none';
            } else {
                detailBox.style.display = 'flex';
            }
        }

        function saveHistoryRecord(catId, score, total, detailsData) {
            let catName = '🎯 Tất Cả Từ';
            if (catId === 'wrong_words') {
                catName = '⚠️ Ôn Từ Làm Sai';
            } else if (catId !== 'all') {
                const found = categories.find(c => c.id === catId);
                if (found) catName = `${found.icon} ${found.name}`;
            }

            const now = new Date();
            const dateStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')} - ${now.getDate()}/${now.getMonth() + 1}/${now.getFullYear()}`;

            const record = {
                categoryName: catName,
                score: score,
                total: total,
                date: dateStr,
                details: detailsData
            };

            testHistory.unshift(record);
            localStorage.setItem('vocab_history', JSON.stringify(testHistory));
        }

        function clearHistory() {
            if (confirm("Bạn có chắc muốn xóa tất cả lịch sử làm bài?")) {
                testHistory = [];
                localStorage.removeItem('vocab_history');
                renderHistory();
            }
        }

        async function createNewCategory() {
            const nameInput = document.getElementById('new-cat-name');
            const iconInput = document.getElementById('new-cat-icon');

            const name = nameInput.value.trim();
            const icon = iconInput.value.trim() || '📁';

            if (!name) {
                alert("Vui lòng nhập tên chủ đề!");
                return;
            }

            const newId = 'cat_' + Date.now();
            const categoryObj = { id: newId, name: name, icon: icon };
            
            categories.push(categoryObj);
            dbVocabulary[newId] = [];

            saveToLocalStorage();
            renderCategoryGrid();
            renderCategoryDropdown();

            await exportCategoryToJSON(newId);

            nameInput.value = '';
            iconInput.value = '';
        }

        async function addNewWord() {
            const catId = document.getElementById('select-category').value;
            const enInput = document.getElementById('new-en');
            const phoneticInput = document.getElementById('new-phonetic');
            const viInput = document.getElementById('new-vi');

            const enVal = enInput.value.trim();
            const phoneticVal = phoneticInput.value.trim();
            const viVal = viInput.value.trim();

            if (!enVal || !viVal) {
                alert("Vui lòng nhập từ tiếng Anh và nghĩa tiếng Việt!");
                return;
            }

            if (!dbVocabulary[catId]) dbVocabulary[catId] = [];

            dbVocabulary[catId].push({
                word: enVal,
                phonetic: phoneticVal || "",
                meaning: viVal
            });

            saveToLocalStorage();
            await exportCategoryToJSON(catId);

            enInput.value = '';
            phoneticInput.value = '';
            viInput.value = '';
        }

        function importJSONFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.category && data.words) {
                        const catIndex = categories.findIndex(c => c.id === data.category.id);
                        if (catIndex >= 0) {
                            categories[catIndex] = data.category;
                        } else {
                            categories.push(data.category);
                        }
                        dbVocabulary[data.category.id] = data.words;

                        saveToLocalStorage();
                        renderCategoryGrid();
                        renderCategoryDropdown();

                        alert(`Đã nạp thành công bộ từ: "${data.category.name}"!`);
                    } else {
                        alert("Định dạng file JSON không hợp lệ!");
                    }
                } catch (err) {
                    alert("Lỗi khi đọc file JSON!");
                }
            };
            reader.readAsText(file);
        }

        async function exportCategoryToJSON(catId) {
            const categoryObj = categories.find(c => c.id === catId);
            const wordsList = dbVocabulary[catId] || [];

            const jsonData = {
                category: categoryObj,
                words: wordsList
            };

            const filename = `${categoryObj.name.toLowerCase().replace(/\s+/g, '_')}_data.json`;
            const jsonStr = JSON.stringify(jsonData, null, 4);

            if ('showSaveFilePicker' in window) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: filename,
                        types: [{
                            description: 'JSON File',
                            accept: { 'application/json': ['.json'] },
                        }],
                    });
                    const writable = await handle.createWritable();
                    await writable.write(jsonStr);
                    await writable.close();
                } catch (err) {
                    console.log('Đã hủy lưu file');
                }
            } else {
                downloadJSON(jsonData, filename);
            }
        }

        function downloadJSON(dataObject, filename) {
            const jsonStr = JSON.stringify(dataObject, null, 4);
            const blob = new Blob([jsonStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function generateQuizOptions(correctMeaning, categoryId) {
            let pool = [];

            Object.keys(dbVocabulary).forEach(k => {
                dbVocabulary[k].forEach(item => {
                    if (item.meaning !== correctMeaning) {
                        pool.push(item.meaning);
                    }
                });
            });

            pool = [...new Set(pool)].sort(() => Math.random() - 0.5);

            const distractors = pool.slice(0, 3);
            const defaultFallback = ["Nghĩa A", "Nghĩa B", "Nghĩa C"];
            while (distractors.length < 3) {
                distractors.push(defaultFallback[distractors.length]);
            }

            return [correctMeaning, ...distractors].sort(() => Math.random() - 0.5);
        }

        function startQuiz(category) {
            currentCategory = category;
            let rawWords = [];

            if (category === 'wrong_words') {
                rawWords = [...wrongWordsStore];
            } else if (category === 'all') {
                Object.keys(dbVocabulary).forEach(key => {
                    rawWords.push(...dbVocabulary[key]);
                });
            } else {
                rawWords = [...(dbVocabulary[category] || [])];
            }

            if (rawWords.length === 0) {
                alert("Không có từ vựng nào để làm bài!");
                return;
            }

            currentQuizData = rawWords.map(item => ({
                word: item.word,
                phonetic: item.phonetic || '',
                correct: item.meaning,
                options: generateQuizOptions(item.meaning, category),
                userStatus: 'pending'
            }));

            currentQuizData.sort(() => Math.random() - 0.5);

            currentQuestion = 0;
            score = 0;
            document.getElementById('review-section').style.display = 'none';
            showPage('quiz-page');
            renderSidebar();
            loadQuestion();
        }

        function renderSidebar() {
            const gridContainer = document.getElementById('grid-questions');
            gridContainer.innerHTML = '';

            currentQuizData.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;

                if (index === currentQuestion) box.classList.add('active');
                if (q.userStatus === 'correct') box.classList.add('correct');
                else if (q.userStatus === 'wrong') box.classList.add('wrong');

                box.onclick = () => {
                    currentQuestion = index;
                    renderSidebar();
                    loadQuestion();
                };

                gridContainer.appendChild(box);
            });
        }

        function loadQuestion() {
            const data = currentQuizData[currentQuestion];
            
            document.getElementById('word-display').textContent = data.word;
            
            const phoneticElem = document.getElementById('phonetic-display');
            if (data.phonetic) {
                phoneticElem.textContent = data.phonetic;
                phoneticElem.style.display = 'block';
            } else {
                phoneticElem.style.display = 'none';
            }

            const progressPercent = ((currentQuestion + 1) / currentQuizData.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            data.options.forEach(option => {
                const button = document.createElement('button');
                button.className = 'btn-option';
                button.textContent = option;

                if (data.userStatus !== 'pending') {
                    if (option === data.correct) button.classList.add('correct');
                    else if (option === data.selectedAnswer && data.userStatus === 'wrong') button.classList.add('wrong');
                } else {
                    button.onclick = () => checkAnswer(button, option, data.correct);
                }

                optionsContainer.appendChild(button);
            });
        }

        function checkAnswer(selectedBtn, selectedOption, correctOption) {
            const data = currentQuizData[currentQuestion];
            if (data.userStatus !== 'pending') return;

            data.selectedAnswer = selectedOption;

            if (selectedOption === correctOption) {
                selectedBtn.classList.add('correct');
                data.userStatus = 'correct';
                score++;
            } else {
                selectedBtn.classList.add('wrong');
                data.userStatus = 'wrong';
                Array.from(document.getElementById('options-container').children).forEach(btn => {
                    if (btn.textContent === correctOption) btn.classList.add('correct');
                });
            }

            renderSidebar();

            setTimeout(() => {
                if (currentQuestion < currentQuizData.length - 1) {
                    currentQuestion++;
                    renderSidebar();
                    loadQuestion();
                } else {
                    const allDone = currentQuizData.every(q => q.userStatus !== 'pending');
                    if (allDone) showResults();
                }
            }, 800);
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderSidebar();
                loadQuestion();
            }
        }

        function nextQuestion() {
            if (currentQuestion < currentQuizData.length - 1) {
                currentQuestion++;
                renderSidebar();
                loadQuestion();
            }
        }

        function showResults() {
            showPage('result-page');
            document.getElementById('final-score').textContent = `${score}/${currentQuizData.length}`;
            const percentage = (score / currentQuizData.length) * 100;
            const feedback = document.getElementById('feedback-text');
            
            if (percentage === 100) feedback.textContent = "🎉 Quá đỉnh! Bạn đạt điểm tuyệt đối!";
            else if (percentage >= 60) feedback.textContent = "👍 Rất tốt! Hãy luyện tập thêm để hoàn hảo hơn.";
            else feedback.textContent = "💪 Cố gắng lên! Hãy ôn lại bài học này nhé.";

            updateWrongWordsAndHistory();
        }

        function updateWrongWordsAndHistory() {
            currentQuizData.forEach(q => {
                const existingIndex = wrongWordsStore.findIndex(w => w.word.toLowerCase() === q.word.toLowerCase());

                if (q.userStatus === 'wrong') {
                    if (existingIndex === -1) {
                        wrongWordsStore.push({
                            word: q.word,
                            phonetic: q.phonetic,
                            meaning: q.correct
                        });
                    }
                } else if (q.userStatus === 'correct') {
                    if (existingIndex !== -1) {
                        wrongWordsStore.splice(existingIndex, 1);
                    }
                }
            });

            saveToLocalStorage();
            saveHistoryRecord(currentCategory, score, currentQuizData.length, currentQuizData);
        }

        function toggleReviewSection() {
            const section = document.getElementById('review-section');
            if (section.style.display === 'none' || section.style.display === '') {
                renderReviewList();
                section.style.display = 'block';
            } else {
                section.style.display = 'none';
            }
        }

        function renderReviewList() {
            const listContainer = document.getElementById('review-list');
            listContainer.innerHTML = '';

            currentQuizData.forEach((item, index) => {
                const isCorrect = item.userStatus === 'correct';
                const card = document.createElement('div');
                card.className = `review-item ${isCorrect ? 'is-correct' : 'is-wrong'}`;

                let answerHTML = '';
                if (isCorrect) {
                    answerHTML = `<span class="text-correct">✓ ${item.correct}</span>`;
                } else {
                    answerHTML = `
                        <span class="text-wrong">${item.selectedAnswer || 'Bỏ dở'}</span>
                        <span class="text-correct">✓ ${item.correct}</span>
                    `;
                }

                card.innerHTML = `
                    <div class="review-word-info">
                        <div class="review-word-en">Câu ${index + 1}: ${item.word}</div>
                        ${item.phonetic ? `<div class="review-word-phonetic">${item.phonetic}</div>` : ''}
                    </div>
                    <div class="review-answers">
                        ${answerHTML}
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }
    </script>
</body>
</html>
